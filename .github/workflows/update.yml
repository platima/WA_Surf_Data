# Fetches the DoT wave charts, updates site/ and publishes it to GitHub Pages.
# Behaviour, limits and setup are documented in the capenat_waves.py docstring.
name: Update wave data

on:
  schedule:
    # DoT refreshes at about :25 and :55; run two minutes later. Cron minutes are the same in UTC and WST.
    - cron: "27,57 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["capenat_waves.py", "requirements.txt", ".github/workflows/update.yml"]

# One run at a time, so two runs never push over each other.
concurrency:
  group: update-wave-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # commit site/ (keeps history between runs and counts as repo activity)
      pages: write      # deploy to Pages
      id-token: write   # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and parse charts
        id: build
        # Exit code 1 is an alert: a chart failed to parse, so DoT probably changed its charts and the script
        # needs updating (docstring, FAILURE HANDLING). site/ is still updated so the page shows the error, and
        # the run is marked failed afterwards so GitHub emails you. DoT outages exit 0 and only show on the page.
        run: python capenat_waves.py --out site || echo "failed=1" >> "$GITHUB_OUTPUT"

      - name: Commit site/
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Update wave data $(TZ=Australia/Perth date '+%Y-%m-%d %H:%M') WST"
          # GitHub sometimes rejects a push with an Internal Server Error (three runs on 4 Nov 2026), so try
          # up to three times. A failure on the third try still fails the run, since the data was not saved.
          for try in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            if [ "$try" = 3 ]; then exit 1; fi
            echo "push failed (try $try of 3); retrying in 15 s"
            sleep 15
          done
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v6
        if: steps.commit.outputs.changed == '1' || github.event_name != 'schedule'

      - uses: actions/upload-pages-artifact@v5
        if: steps.commit.outputs.changed == '1' || github.event_name != 'schedule'
        with:
          path: site

      # GitHub's deploy step sometimes cannot find the artifact this run has just uploaded ("Fetching artifact
      # metadata failed", 31 runs in Nov 2026). Try once more after a pause. If that fails too, the run still
      # passes with a warning: site/ is already committed, and the next run deploys it.
      - id: deploy
        uses: actions/deploy-pages@v5
        if: steps.commit.outputs.changed == '1' || github.event_name != 'schedule'
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy2
        uses: actions/deploy-pages@v5
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true

      - name: Report deploy failure
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: echo "::warning::GitHub Pages deploy failed twice; site/ is committed and the next run will deploy it."

      - name: Report alert
        if: steps.build.outputs.failed == '1'
        run: |
          echo "::error::A DoT chart failed to parse, so the script may need updating; see the 'alert:' lines in the 'Fetch and parse charts' step log."
          exit 1
